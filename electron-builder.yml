# 桌面打包配置。main 指向 electron-vite 的构建产物 out/main/index.js，
# 打进包里的只有 out/ 下的三份产物，外加构建信息和许可声明。

appId: com.jwker.atracker
productName: ATracker
directories:
  output: release
  buildResources: build

# 用本地已经下载好的 Electron，不去 GitHub 拉（国内网络经常连不上）。
electronDist: node_modules/electron/dist

files:
  - package.json
  # MIT 要求「副本或实质部分必须保留本声明」。包里带的是完整源码，
  # 属于实质部分，所以 LICENSE 要显式打进去，不能依赖 electron-builder
  # 的隐式复制。
  - LICENSE
  - THIRD_PARTY_NOTICES.txt
  - build/buildinfo.json
  # main / preload / renderer 三段产物，schema.sql 也在 out/main 里
  - out/**
  # 运行时不需要任何第三方依赖：electron 是内置的，SQLite 用 node:sqlite，
  # 前端已经被打进 out/renderer
  - "!node_modules/**"
  - "!**/*.map"

# 沙箱化的 preload 从 asar 里解出来，避免「读不到 preload」这类和环境相关的问题
asarUnpack:
  - out/preload/**

mac:
  category: public.app-category.developer-tools
  extendInfo:
    # 同一个 App 的第二份副本不允许同时运行，由系统拦，比应用内加锁更早生效
    LSMultipleInstancesProhibited: true
  target:
    - dmg
    - zip
  # 文件名带提交哈希：0.1.1 这一版可以打很多次包而不互相覆盖
  artifactName: ATracker-${version}-${env.BUILD_STAMP}-${arch}.${ext}

win:
  target:
    - nsis
  artifactName: ATracker-${version}-${env.BUILD_STAMP}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
