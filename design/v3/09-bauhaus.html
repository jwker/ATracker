<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATracker — Bauhaus</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --font: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f2ecdf;
    --panel: #faf6ec;
    --panel2: #e9e1d1;
    --ink: #16130f;
    --muted: #6b6256;
    --faint: #9a8f80;
    --line: #c8bca8;
    --rule: #16130f;
    --red: #cf3a24;
    --blue: #1f4fa3;
    --yellow: #eab021;
    --ok: #1b7a4d;
    --warn: #a86a00;
    --err: #b32a1c;
    --sel: #f4dfad;
    --dark: #16130f;
    --dark-ink: #f2ecdf;
    --b0: #2a78d6; --b1: #eb6834; --b2: #1baf7a; --b3: #eda100;
    --d0: #2a78d6; --d1: #eb6834; --d2: #1baf7a; --d3: #eda100; --d4: #e87ba4; --d5: #008300;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #151310;
    --panel: #1d1a15;
    --panel2: #26221b;
    --ink: #f2ecdf;
    --muted: #b3a897;
    --faint: #7f7567;
    --line: #4a4238;
    --rule: #f2ecdf;
    --red: #ff6b4a;
    --blue: #7ba4ff;
    --yellow: #ffc94a;
    --ok: #4fce8d;
    --warn: #ffc24a;
    --err: #ff7a62;
    --sel: #3a3018;
    --dark: #f2ecdf;
    --dark-ink: #151310;
    --b0: #3987e5; --b1: #d95926; --b2: #199e70; --b3: #c98500;
    --d0: #3987e5; --d1: #d95926; --d2: #199e70; --d3: #c98500; --d4: #d55181; --d5: #008300;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--yellow); color: var(--ink); }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  .frame { max-width: 1420px; margin: 0 auto; padding: 20px 22px 34px; }

  /* ---------- masthead ---------- */
  .mast {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 14px 26px;
    border-bottom: 4px solid var(--rule);
    padding-bottom: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
  .logo i { display: block; width: 10px; background: var(--ink); }
  .logo i:nth-child(1) { height: 16px; background: var(--red); }
  .logo i:nth-child(2) { height: 34px; background: var(--ink); }
  .logo i:nth-child(3) { height: 23px; background: var(--blue); }
  .word { font-size: 30px; line-height: .9; font-weight: 800; letter-spacing: -.045em; }
  .brand-sub { color: var(--muted); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; padding-bottom: 2px; white-space: nowrap; }
  .mast-right { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 16px; }
  .nav { display: flex; gap: 0; border: 2px solid var(--rule); }
  .nav button {
    background: transparent;
    border: 0;
    border-right: 2px solid var(--rule);
    padding: 7px 13px 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .nav button:last-child { border-right: 0; }
  .nav button[aria-current="true"] { background: var(--ink); color: var(--paper); }
  .utils { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; }
  .ulab { color: var(--faint); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }
  .ubtn {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    padding: 1px 1px 2px; color: var(--muted); font-size: 10px; letter-spacing: .04em;
  }
  .ubtn:hover { color: var(--ink); }
  .ubtn[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--red); }
  .mast-rule { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0 0; color: var(--faint); font-size: 8px; letter-spacing: .12em; text-transform: uppercase; }

  .view { padding-top: 18px; display: flex; flex-direction: column; gap: 16px; }

  /* ---------- panels ---------- */
  .panel { background: var(--panel); border: 2px solid var(--rule); min-width: 0; }
  .phead {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 7px 10px 6px; border-bottom: 2px solid var(--rule);
    font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  }
  .phead .pm { color: var(--muted); font-weight: 400; letter-spacing: .04em; text-transform: none; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbody { padding: 12px; }
  .ticks { display: flex; gap: 4px; align-items: center; }
  .ticks i { display: block; width: 7px; height: 7px; background: var(--ink); }
  .ticks i:nth-child(2) { background: var(--red); }
  .ticks i:nth-child(3) { background: var(--blue); }

  .top-grid { display: grid; grid-template-columns: minmax(0, 8.4fr) minmax(0, 3.6fr); gap: 14px; }
  .hero { position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 7px; background: var(--red); }
  .hero .phead { border-top: 0; padding-top: 12px; }
  .hero-body { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 10px; padding: 16px 16px 14px; align-items: end; }
  .kicker { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .huge {
    font-size: clamp(56px, 9vw, 122px); line-height: .87; font-weight: 800; letter-spacing: -.055em;
    margin: 9px 0 10px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .huge .u { color: var(--red); }
  html[data-unit="full"] .huge { font-size: clamp(34px, 6vw, 82px); }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 9px; }
  .hero-meta b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .geo { position: relative; height: 150px; overflow: hidden; }
  .geo .circle { position: absolute; right: 8px; top: 6px; width: 128px; height: 128px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--rule); }
  .geo .half { position: absolute; right: 66px; top: 62px; width: 70px; height: 70px; background: var(--blue); border: 3px solid var(--rule); border-radius: 70px 0 0 0; }
  .geo .wedge { position: absolute; right: 2px; bottom: 4px; width: 54px; height: 54px; background: var(--red); }
  .geo .stick { position: absolute; left: 8px; top: 16px; width: 3px; height: 108px; background: var(--rule); }
  .geo .dot { position: absolute; left: 2px; bottom: 16px; width: 15px; height: 15px; background: var(--rule); border-radius: 50%; }

  .side-dark { background: var(--dark); color: var(--dark-ink); border-color: var(--rule); display: flex; flex-direction: column; }
  .side-dark .phead { border-color: var(--dark-ink); color: var(--dark-ink); }
  .side-dark .phead .pm { color: var(--dark-ink); opacity: .7; }
  .side-body { padding: 14px 14px 12px; display: flex; flex-direction: column; flex: 1; }
  .side-lab { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
  .cost { font-size: clamp(30px, 3.4vw, 46px); font-weight: 800; line-height: .95; letter-spacing: -.04em; margin: 8px 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cost-sub { font-family: var(--mono); font-size: 9px; opacity: .7; }
  .side-list { margin-top: auto; padding-top: 16px; display: grid; gap: 8px; }
  .side-row { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid currentColor; padding-top: 5px; font-size: 9px; opacity: .92; }
  .side-row b { font-weight: 700; font-variant-numeric: tabular-nums; }

  .mid-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; align-items: start; }
  .two-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .side-stack { display: grid; gap: 14px; align-content: start; }

  /* ---------- calendar ---------- */
  .cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; border-bottom: 2px solid var(--rule); }
  .cal-title { font-size: 15px; font-weight: 800; letter-spacing: -.02em; margin-right: 4px; }
  .calctl { display: flex; gap: 3px; margin-left: auto; }
  .sqbtn { background: transparent; border: 2px solid var(--rule); padding: 3px 7px 2px; font-size: 9px; font-weight: 700; letter-spacing: .06em; }
  .sqbtn:hover { background: var(--ink); color: var(--paper); }
  .cal-weeks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 2px solid var(--rule); }
  .cal-weeks span { padding: 4px 3px; text-align: center; font-size: 7px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .day {
    position: relative; min-height: 64px; display: flex; flex-direction: column; justify-content: space-between;
    gap: 4px; padding: 5px 5px 4px; background: transparent; border: 0;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left;
  }
  .day:nth-child(7n) { border-right: 0; }
  .day:hover { background: var(--panel2); }
  .day.blank { background: var(--panel2); opacity: .45; cursor: default; pointer-events: none; }
  .day[aria-pressed="true"] { background: var(--sel); }
  .day.sel { outline: 3px solid var(--red); outline-offset: -3px; z-index: 1; }
  .day .dn { font-size: 13px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .day .dv { color: var(--muted); font-size: 8px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .day .dbar { display: flex; gap: 1px; height: 9px; width: 100%; background: var(--panel2); }
  .day .dbar i { display: block; height: 100%; min-width: 1px; }
  .day .zero { display: block; width: 100%; height: 100%; background: var(--panel2); }
  .cal-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; padding: 7px 10px; border-top: 2px solid var(--rule); font-size: 8px; color: var(--muted); }
  .cal-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-direction: column; gap: 2px; }
  .lg {
    display: grid; grid-template-columns: 11px minmax(0, 1fr) auto; align-items: center; gap: 7px;
    background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 4px 0; text-align: left; font-size: 9px;
  }
  .lg i { display: block; width: 11px; height: 11px; }
  .lg .ln { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg .lv { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 8px; }
  .lg[aria-pressed="false"] { opacity: .34; }
  .lg[aria-pressed="false"] .ln { text-decoration: line-through; }
  .lgnote { margin-top: 8px; color: var(--faint); font-size: 8px; line-height: 1.55; }

  /* ---------- selection ---------- */
  .sel-scope { font-size: 10px; letter-spacing: .06em; color: var(--muted); }
  .sel-num { font-size: clamp(34px, 4.4vw, 56px); font-weight: 800; line-height: .9; letter-spacing: -.04em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .sel-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 9px; color: var(--muted); margin-bottom: 10px; }
  .sel-meta b { color: var(--ink); font-weight: 700; }
  .brow { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 5.2em; align-items: center; gap: 7px; padding: 3px 0; font-size: 9px; }
  .brow .bn { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .brow .bn i { width: 8px; height: 8px; display: block; flex: 0 0 auto; }
  .brow .bn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .track { height: 10px; background: var(--panel2); overflow: hidden; }
  .brow .track i { display: block; height: 100%; }
  .brow .bv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 8px; white-space: nowrap; }
  .hint { color: var(--faint); font-size: 8px; line-height: 1.5; }

  /* ---------- rankings ---------- */
  .rank { padding: 8px 10px 10px; }
  .rrow { display: grid; grid-template-columns: 9px minmax(0, 1fr) 78px 4.2em; align-items: center; gap: 8px; padding: 5px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: left; font: inherit; }
  .rrow:last-child { border-bottom: 0; }
  .rrow .sw { width: 9px; height: 9px; background: var(--ink); }
  .rrow .rn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .rrow .rb { height: 8px; background: var(--panel2); overflow: hidden; }
  .rrow .rb i { display: block; height: 100%; background: var(--ink); }
  .rrow .rv { text-align: right; font-size: 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rrow .rv small { display: block; color: var(--faint); font-size: 8px; }
  .rrow[data-dir], .rrow[data-model] { cursor: pointer; }
  .rrow[data-dir]:hover, .rrow[data-model]:hover { background: var(--panel2); }

  /* ---------- matrix ---------- */
  .mxwrap { overflow-x: auto; padding: 4px 10px 10px; }
  table.mx { width: 100%; min-width: 620px; border-collapse: collapse; }
  table.mx th, table.mx td { padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  table.mx th { font-size: 8px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  table.mx th.mh, table.mx td.mn { text-align: left; width: 32%; }
  table.mx td.mn { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.mx td.tot, table.mx th.tot { text-align: right; font-size: 8px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.mx tr.mxfoot td { border-top: 2px solid var(--rule); }
  .dotbtn { display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; background: transparent; border: 0; }
  .dotbtn i { display: block; border-radius: 50%; background: var(--blue); }
  .dotbtn:hover i { outline: 2px solid var(--red); outline-offset: 2px; }
  .dotbtn.zero i { background: transparent; border: 1px solid var(--line); }
  .mxleg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 0 10px 10px; color: var(--faint); font-size: 8px; }
  .mxleg i { display: block; border-radius: 50%; background: var(--blue); }
  .note-strip { border-top: 2px solid var(--rule); padding: 8px 10px; color: var(--muted); font-size: 8px; line-height: 1.6; }
  .note-strip b { color: var(--ink); }

  /* ---------- sessions ---------- */
  .conv-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; border-bottom: 4px solid var(--rule); padding-bottom: 10px; }
  .view-title { font-size: clamp(30px, 4.4vw, 52px); font-weight: 800; letter-spacing: -.05em; line-height: .9; }
  .view-sub { color: var(--muted); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
  .fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border: 2px solid var(--rule); background: var(--panel); font-size: 9px; }
  .field { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .field .fl { color: var(--muted); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .field select, .field input {
    background: var(--paper); border: 1.5px solid var(--rule); padding: 3px 5px; font-size: 9px; min-width: 0; max-width: 15em;
  }
  .field input { width: 17em; }
  .field.wide { flex: 1 1 15em; }
  .field.wide input { width: 100%; max-width: none; flex: 1 1 auto; }
  .fcount { margin-left: auto; color: var(--faint); font-size: 8px; white-space: nowrap; }
  .clearbtn { background: transparent; border: 0; border-bottom: 2px solid var(--red); padding: 1px 0; color: var(--muted); font-size: 8px; }
  .conv-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start; }
  .listbody { max-height: 760px; overflow: auto; }
  .grp { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; background: var(--ink); color: var(--paper); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
  .grp b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .srow {
    display: grid; grid-template-columns: 46px minmax(0, 1fr) 62px; align-items: center; gap: 8px;
    width: 100%; padding: 8px 10px; background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left;
  }
  .srow:hover { background: var(--panel2); }
  .srow[aria-current="true"] { background: var(--ink); color: var(--paper); }
  .srow[aria-current="true"] .smeta, .srow[aria-current="true"] .stok { color: var(--paper); opacity: .75; }
  .sdate { font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); }
  .srow[aria-current="true"] .sdate { color: var(--yellow); }
  .smain { min-width: 0; overflow: hidden; }
  .stitle { display: block; font-size: 11px; font-weight: 700; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .smeta { display: block; color: var(--muted); font-size: 8px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stok { text-align: right; font-size: 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .listfoot { padding: 7px 10px; border-top: 2px solid var(--rule); color: var(--faint); font-size: 8px; }

  .detail-title { font-size: clamp(22px, 2.6vw, 32px); font-weight: 800; letter-spacing: -.035em; line-height: 1.12; margin: 0 0 8px; }
  .kv { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 3px 10px; font-size: 9px; margin-bottom: 10px; }
  .kv .k { color: var(--faint); letter-spacing: .06em; text-transform: uppercase; font-size: 8px; padding-top: 1px; }
  .kv .v { min-width: 0; overflow-wrap: anywhere; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .act { background: transparent; border: 2px solid var(--rule); padding: 4px 8px; font-size: 8px; font-weight: 700; }
  .act:hover { background: var(--ink); color: var(--paper); }
  .sstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid var(--rule); margin-bottom: 12px; }
  .sstat { padding: 7px 8px; border-right: 1px solid var(--line); }
  .sstat:last-child { border-right: 0; }
  .sstat .k { color: var(--faint); font-size: 7px; letter-spacing: .1em; text-transform: uppercase; }
  .sstat .v { font-size: 16px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .subh { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; font-size: 8px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .subh::after { content: ""; height: 2px; flex: 1; background: var(--rule); }
  .tokrow { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) 3.2em; align-items: center; gap: 7px; padding: 3px 0; font-size: 9px; }
  .tokrow .k { color: var(--muted); }
  .tokrow .bar { height: 11px; background: var(--panel2); overflow: hidden; }
  .tokrow .bar i { display: block; height: 100%; }
  .tokrow .p { text-align: right; font-size: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .costline { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 5em; align-items: center; gap: 7px; padding: 2px 0; font-size: 8px; }
  .costline .k { color: var(--muted); }
  .costline .bar { height: 7px; background: var(--panel2); }
  .costline .bar i { display: block; height: 100%; background: var(--red); }
  .costline .v { text-align: right; font-variant-numeric: tabular-nums; }
  .turnwrap { overflow-x: auto; border: 1px solid var(--line); }
  .tgrid { min-width: 520px; }
  .trow { display: grid; grid-template-columns: 44px minmax(0, 1.4fr) 62px 55px 55px 58px 38px; gap: 5px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--line); font-size: 8px; }
  .trow:last-child { border-bottom: 0; }
  .trow.th { background: var(--ink); color: var(--paper); font-size: 7px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 0; }
  .trow .tm { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trow .md { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .n, .trow .c { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trow .st { text-align: right; font-weight: 700; }
  .trow .ok { color: var(--ok); }
  .trow .run { color: var(--blue); }
  .trow .err { color: var(--err); }
  .trow.sub { color: var(--muted); font-size: 7px; }
  .trow.sub .subnote { grid-column: 2 / -1; }
  .dnote { color: var(--faint); font-size: 8px; line-height: 1.6; margin-top: 8px; }
  .dfoot { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; padding: 7px 10px; border-top: 2px solid var(--rule); color: var(--muted); font-size: 8px; }
  .empty { padding: 30px 12px; color: var(--faint); font-size: 10px; text-align: center; }

  /* ---------- logs ---------- */
  .lstats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 2px solid var(--rule); }
  .lstat { padding: 8px 10px; border-right: 1px solid var(--line); background: var(--panel); }
  .lstat:last-child { border-right: 0; }
  .lstat .k { color: var(--faint); font-size: 7px; letter-spacing: .12em; text-transform: uppercase; }
  .lstat .v { font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .lstat .v.warn { color: var(--warn); }
  .lstat .v.err { color: var(--err); }
  .logbar { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 2px solid var(--rule); background: var(--panel); }
  .lgrp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .lgl { color: var(--faint); font-size: 7px; letter-spacing: .12em; text-transform: uppercase; min-width: 4.2em; }
  .chip { background: transparent; border: 1.5px solid var(--line); padding: 2px 7px 1px; font-size: 8px; }
  .chip:hover { border-color: var(--rule); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .lsearch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .lsearch input { background: var(--paper); border: 1.5px solid var(--rule); padding: 3px 6px; font-size: 9px; width: 17em; max-width: 100%; }
  .scanmsg { color: var(--faint); font-size: 7px; }
  .log-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start; }
  .logleft { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .diagrow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 9px; }
  .diagrow:last-child { border-bottom: 0; }
  .diagrow i { display: block; width: 8px; height: 8px; background: var(--ok); }
  .diagrow .dn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .diagrow .ds { color: var(--muted); font-size: 8px; white-space: nowrap; }
  .batches { display: flex; flex-direction: column; }
  .batch { display: grid; grid-template-columns: 40px 62px minmax(0, 1fr); align-items: center; gap: 7px; padding: 6px 10px; background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; font-size: 8px; }
  .batch:hover { background: var(--panel2); }
  .batch .bn { font-weight: 800; color: var(--red); }
  .batch .bt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .batch .bg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .batch .bm { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 3px 10px; color: var(--faint); font-size: 7px; }
  .batch .w { color: var(--warn); }
  .batch .e { color: var(--err); }
  .batch[aria-current="true"] { background: var(--ink); color: var(--paper); }
  .batch[aria-current="true"] * { color: var(--paper) !important; opacity: .82; }
  .stream { max-height: 640px; overflow: auto; }
  .lhead, .lrow { display: grid; grid-template-columns: 58px 46px 82px minmax(0, 1fr); gap: 7px; align-items: baseline; padding: 5px 10px; }
  .lhead { position: sticky; top: 0; z-index: 1; background: var(--ink); color: var(--paper); font-size: 7px; letter-spacing: .1em; text-transform: uppercase; }
  .lrow { border-bottom: 1px solid var(--line); font-size: 8.5px; }
  .lrow .lt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lrow .ll { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 7px; letter-spacing: .04em; white-space: nowrap; }
  .lrow .ll i { display: block; width: 6px; height: 6px; background: currentColor; }
  .lrow .ls { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .lsm { display: none; }
  .lrow .lm { overflow-wrap: anywhere; }
  .lrow.info .ll { color: var(--faint); }
  .lrow.ok .ll { color: var(--ok); }
  .lrow.warn .ll { color: var(--warn); }
  .lrow.err .ll { color: var(--err); }
  .lrow.warn { background: color-mix(in srgb, var(--warn) 9%, transparent); }
  .lrow.err { background: color-mix(in srgb, var(--err) 10%, transparent); }
  .streamfoot { padding: 6px 10px; border-top: 2px solid var(--rule); color: var(--faint); font-size: 8px; }

  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 7px 20px; margin-top: 24px; padding-top: 8px; border-top: 4px solid var(--rule); color: var(--faint); font-size: 8px; letter-spacing: .06em; text-transform: uppercase; }

  /* ---------- responsive ---------- */
  @media (max-width: 1000px) {
    .top-grid, .mid-grid, .two-grid, .conv-grid, .log-grid { grid-template-columns: minmax(0, 1fr); }
    .hero-body { grid-template-columns: minmax(0, 1fr); }
    .geo { display: none; }
    .log-grid > .panel { order: -1; }
    .listbody { max-height: none; }
    .logleft { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  }
  @media (max-width: 760px) {
    .frame { padding: 14px 12px 26px; }
    .mast { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .mast-right { justify-content: flex-start; }
    .word { font-size: 24px; }
    .logo { height: 27px; }
    .logo i:nth-child(2) { height: 27px; }
    .logo i:nth-child(1) { height: 13px; }
    .logo i:nth-child(3) { height: 19px; }
    .brand-sub { display: none; }
    .mast-rule { display: none; }
    .lstats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .lstat:nth-child(3n) { border-right: 0; }
    .sstats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sstat:nth-child(2n) { border-right: 0; }
    .sstat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .logleft { grid-template-columns: minmax(0, 1fr); }
    .cal .day { min-height: 50px; }
    .day .dv { display: none; }
    .day .dn { font-size: 11px; }
    .day .dbar { height: 7px; }
    .fbar { gap: 5px 8px; }
    .field input { width: 100%; }
    .field.wide { flex-basis: 100%; }
    .trow { grid-template-columns: 40px minmax(0, 1.4fr) 55px 48px 48px 52px 34px; font-size: 7.5px; }
  }
  @media (max-width: 520px) {
    .hero-body { padding: 12px 12px 12px; }
    .huge { font-size: 52px; }
    html[data-unit="full"] .huge { font-size: 30px; }
    .top-grid, .mid-grid, .two-grid { gap: 10px; }
    .view { gap: 10px; }
    .phead { padding: 6px 8px 5px; }
    .pbody, .rank { padding: 9px; }
    .geo { display: none; }
    .day { min-height: 43px; padding: 4px 3px 3px; }
    .day .dn { font-size: 10px; }
    .day .dbar { height: 6px; }
    .cal-weeks span { font-size: 6px; }
    .brow { grid-template-columns: 7.2em minmax(0, 1fr) 3.4em; gap: 5px; }
    .rrow { grid-template-columns: 8px minmax(0, 1fr) 58px 3.6em; gap: 6px; }
    .rrow .rn { font-size: 9px; }
    .srow { grid-template-columns: 40px minmax(0, 1fr) 55px; gap: 6px; padding: 7px 8px; }
    .sdate { font-size: 10px; }
    .stitle { font-size: 10px; }
    .fbar { padding: 7px 8px; }
    .field select { max-width: none; width: 100%; }
    .fbar .field { flex: 1 1 40%; }
    .fbar .field.wide { flex-basis: 100%; }
    .lhead, .lrow { grid-template-columns: 50px 38px minmax(0, 1fr); }
    .lhead .lsh, .lrow .ls { display: none; }
    .lrow .lsm { color: var(--faint); margin-right: 3px; }
    .lhead, .lrow { font-size: 8px; }
    .lrow .lsm { display: inline; }
    .stream { max-height: 520px; }
    .lstats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lstat:nth-child(3n) { border-right: 1px solid var(--line); }
    .lstat:nth-child(2n) { border-right: 0; }
    .field.wide input { width: 100%; }
    .mast-right { gap: 6px 10px; }
    .nav button { padding: 6px 9px 5px; font-size: 9px; }
    .ubtn { font-size: 9px; }
    .foot { font-size: 7px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="_core.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var W = TK.W, S = TK.state;
  var VIEW = { home: 'overview', conv: 'sessions', log: 'logs' };
  var MQ = window.matchMedia('(max-width: 720px)');

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function dc(slot) { return 'var(--d' + slot + ')'; }
  function bc(i) { return 'var(--b' + i + ')'; }
  function at(k) { return esc(k); }
  function selRange(k) {
    if (!S.sel) return false;
    return k >= S.sel.start && k <= S.sel.end;
  }
  function money(n) { return TK.money(n); }

  /* ---------- shell ---------- */
  function shell(body) {
    document.documentElement.setAttribute('data-unit', TK.unit());
    var nav = [['home', 'overview'], ['conv', 'sessions'], ['log', 'logs']].map(function (x) {
      return '<button data-nav="' + x[0] + '" aria-current="' + (S.view === x[0] ? 'true' : 'false') + '">' + x[1] + '</button>';
    }).join('');
    var units = TK.UNITS.map(function (u) {
      return '<button class="ubtn" data-unit="' + u.id + '" aria-pressed="' + (TK.unit() === u.id ? 'true' : 'false') + '">' + u.id + '</button>';
    }).join('');
    var themes = [['light', 'day'], ['dark', 'night']].map(function (t) {
      return '<button class="ubtn" data-theme-set="' + t[0] + '" aria-pressed="' + (S.theme === t[0] ? 'true' : 'false') + '">' + t[1] + '</button>';
    }).join('');
    var last = W.BATCHES[0];
    return '<div class="frame">' +
      '<header class="mast">' +
        '<div class="brand">' +
          '<span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>' +
          '<span class="word">ATRACKER</span>' +
          '<span class="brand-sub">token observatory / 2026</span>' +
        '</div>' +
        '<div class="mast-right">' +
          '<nav class="nav" aria-label="视图">' + nav + '</nav>' +
          '<div class="utils">' +
            '<span class="ulab">unit</span>' + units +
            '<span class="ulab">theme</span>' + themes +
          '</div>' +
        '</div>' +
        '<div class="mast-rule"><span>local / read-only / rate ' + TK.RATE.toFixed(2) + '</span><span>scan ' + esc(last.at.slice(0, 16)) + '</span></div>' +
      '</header>' +
      '<main class="view">' + body + '</main>' +
      '<footer class="foot">' +
        '<span>ATracker / token observatory</span>' +
        '<span>估算成本 · 人民币按 ' + TK.RATE.toFixed(2) + ' 折算</span>' +
        '<span>数据截至 ' + esc(last.at.slice(0, 16)) + '</span>' +
      '</footer>' +
    '</div>';
  }

  /* ---------- home ---------- */
  function geo() {
    return '<div class="geo" aria-hidden="true">' +
      '<span class="stick"></span><span class="circle"></span><span class="half"></span>' +
      '<span class="wedge"></span><span class="dot"></span>' +
    '</div>';
  }

  function calPane(keys, leg) {
    var meta = TK.monthMeta(S.month);
    var mk = TK.monthKeys(S.month);
    var cells = '';
    for (var i = 0; i < meta.lead; i++) cells += '<div class="day blank"></div>';
    mk.forEach(function (k) {
      var items = TK.dayItems(k, leg.ranked);
      var day = W.days[k];
      var segs = items.map(function (x) {
        return '<i style="width:' + x.pct.toFixed(2) + '%;background:' + dc(x.slot) + '"></i>';
      }).join('');
      var bar = segs || '<span class="zero"></span>';
      cells += '<button class="day' + (selRange(k) ? ' sel' : '') + '" data-day="' + k + '" aria-pressed="' + (selRange(k) ? 'true' : 'false') + '">' +
        '<span class="dn">' + k.slice(8) + '</span>' +
        '<span class="dv">' + (day && day.total ? esc(TK.fmtTok(day.total)) : '·') + '</span>' +
        '<span class="dbar">' + bar + '</span>' +
      '</button>';
    });
    var hidden = S.offDirs.length;
    return '<section class="panel">' +
      '<div class="cal-head">' +
        '<span class="cal-title">' + esc(S.month.replace('-', ' / ')) + '</span>' +
        '<span class="hint">' + (hidden ? hidden + ' 个目录已隐藏' : '点击日期选择 · 再点一天成范围') + '</span>' +
        '<span class="calctl">' +
          '<button class="sqbtn" data-shift="-1" aria-label="上个月">←</button>' +
          '<button class="sqbtn" data-shift="1" aria-label="下个月">→</button>' +
          '<button class="sqbtn" data-latest="1">本月</button>' +
        '</span>' +
      '</div>' +
      '<div class="cal-weeks">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div>' +
      '<div class="cal">' + cells + '</div>' +
      '<div class="cal-foot"><span><b>' + esc(S.month) + '</b> · ' + meta.dim + ' 天</span><span>色块 = 目录占比</span></div>' +
    '</section>';
  }

  function legendPane(keys, leg) {
    var rows = leg.ranked.map(function (x) {
      var off = S.offDirs.indexOf(x.path) >= 0;
      return '<button class="lg" data-legend="' + esc(x.path) + '" aria-pressed="' + (!off ? 'true' : 'false') + '">' +
        '<i style="background:' + dc(x.slot) + '"></i>' +
        '<span class="ln">' + esc(x.name) + '</span>' +
        '<span class="lv">' + esc(TK.fmtTok(x.v)) + '</span>' +
      '</button>';
    }).join('');
    return '<div class="pbody" style="padding-top:8px">' +
      '<div class="legend">' + rows + '</div>' +
      '<div class="lgnote">点击目录可隐藏或恢复它在日历中的色块。隐藏只影响日历，不改变任何汇总数字。</div>' +
    '</div>';
  }

  function dirRows(d) {
    return d.dirs.map(function (x) {
      var w = d.agg.total ? x.v / d.agg.total * 100 : 0;
      return '<div class="brow">' +
        '<span class="bn"><i style="background:' + dc(x.slot) + '"></i><span>' + esc(x.name) + '</span></span>' +
        '<span class="track"><i style="width:' + Math.max(1, w).toFixed(2) + '%;background:' + dc(x.slot) + '"></i></span>' +
        '<span class="bv">' + esc(TK.fmtTok(x.v)) + '</span>' +
      '</div>';
    }).join('');
  }

  function ranking(title, meta, rows, max, kind) {
    var body = rows.map(function (x, i) {
      var color = kind === 'dir' ? dc(x.slot) : 'var(--blue)';
      var w = max ? x.v / max * 100 : 0;
      return '<button class="rrow" data-' + kind + '="' + esc(kind === 'dir' ? x.path : x.id) + '">' +
        '<span class="sw" style="background:' + color + '"></span>' +
        '<span class="rn">' + esc(kind === 'dir' ? x.name : x.id) + '</span>' +
        '<span class="rb"><i style="width:' + Math.max(1, w).toFixed(2) + '%;background:' + color + '"></i></span>' +
        '<span class="rv">' + esc(TK.fmtTok(x.v)) + '<small>' + TK.fmtPct(max ? x.v / rows.reduce(function (s, y) { return s + y.v; }, 0) : 0) + '</small></span>' +
      '</button>';
    }).join('');
    return '<section class="panel">' +
      '<div class="phead"><span>' + esc(title) + '</span><span class="pm">' + esc(meta) + '</span></div>' +
      '<div class="rank">' + body + '</div>' +
    '</section>';
  }

  function matrixPane(keys) {
    var m = TK.matrixData(keys);
    var cmax = 1;
    m.agents.forEach(function (a) {
      m.keep.forEach(function (mod) { cmax = Math.max(cmax, m.cell[a.id][mod.id]); });
    });
    var head = '<tr><th class="mh">model / source</th>' + m.agents.map(function (a) { return '<th>' + esc(a.id) + '</th>'; }).join('') + '<th class="tot">Σ</th></tr>';
    var body = m.keep.map(function (mod) {
      var tds = m.agents.map(function (a) {
        var v = m.cell[a.id][mod.id];
        var r = Math.sqrt(v / cmax);
        var sz = v ? Math.round(7 + r * 24) : 0;
        return '<td><button class="dotbtn' + (v ? '' : ' zero') + '" data-cell-agent="' + esc(a.id) + '" data-cell-model="' + esc(mod.id) + '" aria-label="' + esc(a.id + ' / ' + mod.id + ' ' + TK.fmtTok(v)) + '" title="' + esc(a.id + ' · ' + mod.id + ' · ' + TK.fmtTok(v)) + '">' +
          '<i style="width:' + (v ? sz : 5) + 'px;height:' + (v ? sz : 5) + 'px;opacity:' + (v ? (0.25 + 0.75 * r).toFixed(2) : 1) + '"></i>' +
        '</button></td>';
      }).join('');
      var row = m.agents.reduce(function (s, a) { return s + m.cell[a.id][mod.id]; }, 0);
      return '<tr><td class="mn">' + esc(mod.id) + '</td>' + tds + '<td class="tot">' + esc(TK.fmtTok(row)) + '</td></tr>';
    }).join('');
    var foot = '<tr class="mxfoot"><td class="mn">Σ</td>' + m.agents.map(function (a) {
      return '<td class="tot">' + esc(TK.fmtTok(m.rowTotal(a))) + '</td>';
    }).join('') + '<td class="tot">' + esc(TK.fmtTok(m.agents.reduce(function (s, a) { return s + m.rowTotal(a); }, 0))) + '</td></tr>';
    return '<section class="panel">' +
      '<div class="phead"><span>MATRIX / 来源 × 模型</span><span class="pm">点 = token 量 · 点击下钻</span></div>' +
      '<div class="mxwrap"><table class="mx"><thead>' + head + '</thead><tbody>' + body + foot + '</tbody></table></div>' +
      '<div class="mxleg"><span>小</span><i style="width:6px;height:6px;opacity:.35"></i><i style="width:14px;height:14px;opacity:.6"></i><i style="width:24px;height:24px;opacity:.9"></i><span>大</span><span>· 颜色深浅与圆点大小都表示用量</span></div>' +
    '</section>';
  }

  function homeView() {
    var keys = TK.rangeKeys();
    var d = TK.detailData(keys);
    var all = TK.aggregate(TK.allKeys());
    var hit = d.agg.total ? d.agg.buckets.cacheRead / d.agg.total : 0;
    var leg = TK.legend(keys);

    var hero = '<section class="panel hero">' +
      '<div class="phead"><span>TOKENS / 当前范围</span><span class="pm">' + esc(TK.scopeText()) + '</span></div>' +
      '<div class="hero-body">' +
        '<div>' +
          '<div class="kicker">total tokens</div>' +
          '<div class="huge">' + esc(TK.fmtTok(d.agg.total)) + '</div>' +
          '<div class="hero-meta">' +
            '<span>覆盖 <b>' + d.agg.days + '</b> 天</span>' +
            '<span>缓存命中 <b>' + TK.fmtPct(hit) + '</b></span>' +
            '<span>未定价 <b>' + esc(TK.fmtTok(d.agg.unpriced)) + '</b></span>' +
          '</div>' +
        '</div>' + geo() +
      '</div>' +
    '</section>';

    var side = '<aside class="panel side-dark">' +
      '<div class="phead"><span>COST / 成本</span><span class="pm">估算</span></div>' +
      '<div class="side-body">' +
        '<div class="side-lab">priced spend</div>' +
        '<div class="cost">' + money(d.agg.usd) + '</div>' +
        '<div class="cost-sub">' + TK.moneyUsd(d.agg.usd) + ' / rate ' + TK.RATE.toFixed(2) + '</div>' +
        '<div class="side-list">' +
          '<div class="side-row"><span>全期 tokens</span><b>' + esc(TK.fmtTok(all.total)) + '</b></div>' +
          '<div class="side-row"><span>全期成本</span><b>' + money(all.usd) + '</b></div>' +
          '<div class="side-row"><span>已定价 token</span><b>' + esc(TK.fmtTok(d.agg.priced)) + '</b></div>' +
          '<div class="side-row"><span>数据截至</span><b>' + esc(W.BATCHES[0].at.slice(0, 10)) + '</b></div>' +
        '</div>' +
      '</div>' +
    '</aside>';

    var sel = '<section class="panel">' +
      '<div class="phead"><span>SELECTION / 选中</span><span class="pm">' + esc(S.sel ? 'range' : 'month') + '</span></div>' +
      '<div class="pbody">' +
        '<div class="sel-scope">' + esc(TK.scopeText()) + '</div>' +
        '<div class="sel-num">' + esc(TK.fmtTok(d.agg.total)) + '</div>' +
        '<div class="sel-meta"><span>成本 <b>' + money(d.agg.usd) + '</b></span><span>缓存 <b>' + TK.fmtPct(hit) + '</b></span></div>' +
        dirRows(d) +
        '<div class="hint">点击日历中的日期可切换单日或范围；点击上方目录 / 模型 / 矩阵圆点进入会话列表。</div>' +
      '</div>' +
    '</section>';

    var dirs = TK.W.DIRS.map(function (x, i) {
      return { path: x.path, name: x.name, slot: i, v: d.agg.byDir[x.path] || 0 };
    }).filter(function (x) { return x.v > 0; }).sort(function (a, b) { return b.v - a.v; });
    var models = d.models;

    var legendPanel = '<section class="panel"><div class="phead"><span>LEGEND / 目录</span><span class="pm">' + leg.ranked.length + ' dirs</span></div>' + legendPane(keys, leg) + '</section>';

    return '<div class="top-grid">' + hero + side + '</div>' +
      '<div class="mid-grid">' + calPane(keys, leg) +
        '<div class="side-stack">' + legendPanel + sel + '</div>' +
      '</div>' +
      '<div class="two-grid">' +
        ranking('DIRECTORY / 目录', '点击查看会话', dirs, dirs.length ? dirs[0].v : 1, 'dir') +
        ranking('MODEL / 模型', '点击查看会话', models, models.length ? models[0].v : 1, 'model') +
      '</div>' +
      matrixPane(keys) +
      '<div class="panel"><div class="note-strip"><b>口径</b> · 四桶合计等于该范围的 token 总量。子 agent 用量归入发起轮次，不重复计数。日期按 Asia/Shanghai 折算自然日。金额为估算值，人民币按固定汇率 ' + TK.RATE.toFixed(2) + ' 折算；未定价模型不计入金额。</div></div>';
  }

  /* ---------- sessions ---------- */
  function convView() {
    var g = TK.convGroups();
    var cur = g.cur;
    var cst = cur ? TK.convStats(cur) : null;
    var any = S.convFilter.dir || S.convFilter.agent || S.convFilter.model || S.convQ;

    var head = '<div class="conv-head">' +
      '<div><div class="view-title">SESSIONS</div><div class="view-sub">会话 / 按目录分组</div></div>' +
      '<div class="hint">' + g.convs.length + ' 个会话 · 点击行查看明细</div>' +
    '</div>';

    var fbar = '<div class="fbar">' +
      '<label class="field"><span class="fl">dir</span><select id="fDir" aria-label="按目录筛选"><option value="">全部</option>' +
        W.DIRS.map(function (x) { return '<option value="' + esc(x.path) + '"' + (S.convFilter.dir === x.path ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="field"><span class="fl">src</span><select id="fAgent" aria-label="按来源筛选"><option value="">全部</option>' +
        W.AGENTS.map(function (x) { return '<option value="' + esc(x.id) + '"' + (S.convFilter.agent === x.id ? ' selected' : '') + '>' + esc(x.id) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="field"><span class="fl">model</span><select id="fModel" aria-label="按模型筛选"><option value="">全部</option>' +
        W.MODELS.map(function (x) { return '<option value="' + esc(x.id) + '"' + (S.convFilter.model === x.id ? ' selected' : '') + '>' + esc(x.id) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="field wide"><span class="fl">q</span><input id="convq" value="' + esc(S.convQ) + '" placeholder="标题 / 目录 / 来源" autocomplete="off" aria-label="搜索会话"></label>' +
      (any ? '<button class="clearbtn" data-clearf="1">清除筛选</button>' : '') +
    '</div>';

    var list = g.groups.length ? g.groups.map(function (gr) {
      return '<div class="grp"><span># ' + esc(gr.dir.name) + '</span><b>' + esc(TK.fmtTok(gr.total)) + '</b></div>' +
        gr.list.map(function (cv) {
          var on = cur && cv.id === cur.id;
          return '<button class="srow" data-cv="' + esc(cv.id) + '" aria-current="' + (on ? 'true' : 'false') + '">' +
            '<span class="sdate">' + esc(cv.date.slice(5)) + '</span>' +
            '<span class="smain"><span class="stitle">' + esc(cv.title) + '</span><span class="smeta">' + esc(cv.source) + ' · ' + esc(cv.model) + '</span></span>' +
            '<span class="stok">' + esc(TK.fmtTok(cv.tokens)) + '</span>' +
          '</button>';
        }).join('');
    }).join('') : '<div class="empty">没有匹配的会话<br><button class="clearbtn" data-clearf="1">清除筛选</button></div>';

    var listPane = '<section class="panel">' +
      '<div class="phead"><span>SESSIONS / 会话</span><span class="pm">' + g.convs.length + ' rows</span></div>' +
      '<div class="listbody">' + list + '</div>' +
      '<div class="listfoot">' + g.groups.length + ' 个目录 · 按日期倒序</div>' +
    '</section>';

    var detail = cur ? detailPane(cur, cst) : '<section class="panel"><div class="phead"><span>DETAIL / 明细</span></div><div class="empty">没有匹配的会话</div></section>';

    return head + fbar + '<div class="conv-grid">' + listPane + detail + '</div>';
  }

  function detailPane(cur, cst) {
    var fail = cur.turnList.filter(function (t) { return t.state === '失败'; }).length;
    var subs = cur.turnList.filter(function (t) { return t.sub; }).length;
    var labels = ['输入', '输出', '缓存命中', '缓存写入'];
    var vals = [cst.tb.input, cst.tb.output, cst.tb.cacheRead, cst.tb.cacheWrite];
    var comp = vals.map(function (v, i) {
      var p = cst.tsum ? v / cst.tsum : 0;
      return '<div class="tokrow">' +
        '<span class="k">' + labels[i] + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(1, p * 100).toFixed(2) + '%;background:' + bc(i) + '"></i></span>' +
        '<span class="p">' + TK.fmtPct(p) + '</span>' +
      '</div>';
    }).join('');

    var days = cst.dayRows.length ? cst.dayRows.map(function (k) {
      return '<div class="costline">' +
        '<span class="k">' + esc(k.slice(5)) + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(1, cst.byDay[k] / cst.maxDay * 100).toFixed(2) + '%"></i></span>' +
        '<span class="v">' + money(cst.byDay[k]) + '</span>' +
      '</div>';
    }).join('') : '<div class="hint">没有已定价的轮次</div>';

    var turns = cur.turnList.map(function (t) {
      var tc = TK.turnCost(t);
      var st = t.state === '失败' ? 'ERR' : t.state === '进行中' ? 'RUN' : 'OK';
      var cls = st === 'ERR' ? 'err' : st === 'RUN' ? 'run' : 'ok';
      var row = '<div class="trow">' +
        '<span class="tm">' + esc(t.time.slice(11, 16)) + '</span>' +
        '<span class="md" title="' + esc(t.model) + '">' + esc(t.model) + '</span>' +
        '<span class="n">' + esc(TK.fmtTok(t.input)) + '</span>' +
        '<span class="n">' + esc(TK.fmtTok(t.output)) + '</span>' +
        '<span class="n">' + esc(TK.fmtTok(t.cache)) + '</span>' +
        '<span class="c">' + (tc.priced ? money(tc.usd) : '--') + '</span>' +
        '<span class="st ' + cls + '">' + st + '</span>' +
      '</div>';
      if (t.sub) {
        row += '<div class="trow sub"><span></span><span class="subnote">└─ 子 agent ×' + esc(t.sub.turns || 0) + ' · 用量并入本轮</span></div>';
      }
      return row;
    }).join('');

    return '<section class="panel">' +
      '<div class="phead"><span>DETAIL / 明细</span><span class="pm">' + esc(cur.id) + '</span></div>' +
      '<div class="pbody">' +
        '<h2 class="detail-title">' + esc(cur.title) + '</h2>' +
        '<div class="kv">' +
          '<span class="k">date</span><span class="v">' + esc(cur.date) + '</span>' +
          '<span class="k">dir</span><span class="v">' + esc(cur.dirName) + '</span>' +
          '<span class="k">source</span><span class="v">' + esc(cur.source) + '</span>' +
          '<span class="k">model</span><span class="v">' + esc(cur.model) + '</span>' +
          '<span class="k">path</span><span class="v">' + esc(cur.dir) + '</span>' +
        '</div>' +
        '<div class="acts"><button class="act" data-tocal="' + esc(cur.id) + '">在日历中查看</button><button class="act" data-backdir="' + esc(cur.id) + '">该目录全部会话</button></div>' +
        '<div class="sstats">' +
          '<div class="sstat"><div class="k">turns</div><div class="v">' + cur.turns + '</div></div>' +
          '<div class="sstat"><div class="k">sub agent</div><div class="v">' + subs + '</div></div>' +
          '<div class="sstat"><div class="k">failed</div><div class="v">' + fail + '</div></div>' +
          '<div class="sstat"><div class="k">tokens</div><div class="v">' + esc(TK.fmtTok(cur.tokens)) + '</div></div>' +
        '</div>' +
        '<div class="subh">token / 构成</div>' + comp +
        '<div class="subh">cost / 按天</div>' + days +
        '<div class="subh">turns / 轮次</div>' +
        '<div class="turnwrap"><div class="tgrid">' +
          '<div class="trow th"><span>time</span><span>model</span><span>in</span><span>out</span><span>cache</span><span>cost</span><span>st</span></div>' +
          turns +
        '</div></div>' +
        '<div class="dnote">成本按模型单价估算 · 未定价轮次显示 --' + (cst.unpriced ? ' · ' + cst.unpriced + ' 轮未定价' : '') + '</div>' +
      '</div>' +
      '<div class="dfoot"><span>' + cur.turns + ' turns</span><span>' + esc(TK.fmtTok(cur.tokens)) + ' tokens</span><span>' + (cst.usd ? money(cst.usd) : '--') + '</span></div>' +
    '</section>';
  }

  /* ---------- logs ---------- */
  function logView() {
    var d = TK.logData();
    var last = d.last;
    var stats = '<div class="lstats">' +
      '<div class="lstat"><div class="k">last scan</div><div class="v">' + esc(last.at.slice(11, 19)) + '</div></div>' +
      '<div class="lstat"><div class="k">events</div><div class="v">' + last.events.toLocaleString('en-US') + '</div></div>' +
      '<div class="lstat"><div class="k">dup</div><div class="v">' + last.dup + '</div></div>' +
      '<div class="lstat"><div class="k">skip</div><div class="v">' + last.skipped + '</div></div>' +
      '<div class="lstat"><div class="k">warn</div><div class="v' + (last.warn ? ' warn' : '') + '">' + last.warn + '</div></div>' +
      '<div class="lstat"><div class="k">err</div><div class="v' + (last.err ? ' err' : '') + '">' + last.err + '</div></div>' +
    '</div>';

    var levels = [['all', 'ALL'], ['info', 'INFO'], ['ok', 'OK'], ['warn', 'WARN'], ['err', 'ERR']];
    var lvl = levels.map(function (x) {
      return '<button class="chip" data-level="' + x[0] + '" aria-pressed="' + (S.log.lvl === x[0] ? 'true' : 'false') + '">' + x[1] + '</button>';
    }).join('');
    var srcs = d.src.map(function (x) {
      return '<button class="chip" data-src="' + esc(x) + '" aria-pressed="' + (S.log.src === x ? 'true' : 'false') + '">' + (x === 'all' ? '全部' : esc(x)) + '</button>';
    }).join('');

    var bar = '<div class="logbar">' +
      '<div class="lgrp"><span class="lgl">level</span>' + lvl + '</div>' +
      '<div class="lgrp"><span class="lgl">source</span>' + srcs + '</div>' +
      '<div class="lsearch"><span class="lgl">search</span><input id="logq" value="' + esc(S.log.q) + '" placeholder="message" autocomplete="off" aria-label="搜索日志">' +
        '<button class="clearbtn" data-logclear="1">清除</button>' +
        '<button class="clearbtn" data-rescan="1">重新扫描</button>' +
        '<span class="scanmsg" id="scanmsg"></span>' +
      '</div>' +
    '</div>';

    var diag = '<section class="panel">' +
      '<div class="phead"><span>SOURCES / 来源</span><span class="pm">' + d.diag.length + '</span></div>' +
      '<div class="pbody" style="padding-top:6px;padding-bottom:6px">' + d.diag.map(function (x) {
        return '<div class="diagrow"><i></i><span class="dn">' + esc(x.name) + '</span><span class="ds">' + esc(x.text) + '</span></div>';
      }).join('') + '</div>' +
    '</section>';

    var batches = '<section class="panel">' +
      '<div class="phead"><span>BATCHES / 批次</span><span class="pm">' + d.batches.length + '</span></div>' +
      '<div class="batches">' + d.batches.map(function (b) {
        return '<button class="batch" data-batch="' + b.id + '" aria-current="' + (S.log.batch === b.id ? 'true' : 'false') + '">' +
          '<span class="bn">#' + b.id + '</span>' +
          '<span class="bt">' + esc(b.at.slice(11, 19)) + '</span>' +
          '<span class="bg">' + esc(b.trigger) + ' · ' + b.files + ' files</span>' +
          '<span class="bm"><span>ev ' + b.events.toLocaleString('en-US') + '</span><span>dup ' + b.dup + '</span><span class="' + (b.warn ? 'w' : '') + '">warn ' + b.warn + '</span><span class="' + (b.err ? 'e' : '') + '">err ' + b.err + '</span></span>' +
        '</button>';
      }).join('') + '</div>' +
    '</section>';

    var stream = '<section class="panel">' +
      '<div class="phead"><span>STREAM / 日志</span><span class="pm">' + d.logs.length + ' rows</span></div>' +
      '<div class="stream">' +
        '<div class="lhead"><span>time</span><span>level</span><span class="lsh">source</span><span>message</span></div>' +
        (d.logs.length ? d.logs.map(function (l) {
          var tag = l.lvl === 'warn' ? 'WARN' : l.lvl === 'err' ? 'ERR' : l.lvl === 'ok' ? 'OK' : 'INFO';
          return '<div class="lrow ' + l.lvl + '">' +
            '<span class="lt">' + esc(l.at.slice(11, 19)) + '</span>' +
            '<span class="ll"><i></i>' + tag + '</span>' +
            '<span class="ls">' + esc(l.src) + '</span>' +
            '<span class="lm"><span class="lsm">' + esc(l.src) + '</span>' + esc(l.msg) + '</span>' +
          '</div>';
        }).join('') : '<div class="empty">没有匹配的日志</div>') +
      '</div>' +
      '<div class="streamfoot">' + d.logs.length + ' rows' + (S.log.batch !== null ? ' / batch #' + S.log.batch : ' / all batches') + '</div>' +
    '</section>';

    return '<div class="conv-head"><div><div class="view-title">LOGS</div><div class="view-sub">扫描日志 / 本地只读</div></div><div class="hint">最近扫描 ' + esc(last.at) + '</div></div>' +
      stats + bar + '<div class="log-grid"><div class="logleft">' + diag + batches + '</div>' + stream + '</div>';
  }

  function route() {
    if (S.view === 'conv') return convView();
    if (S.view === 'log') return logView();
    return homeView();
  }

  var focusId = null, focusPos = 0;
  function draw() {
    var ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT' && ae.id) {
      focusId = ae.id;
      focusPos = ae.selectionStart;
    }
    app.innerHTML = shell(route());
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) {
        el.focus();
        try { el.setSelectionRange(focusPos, focusPos); } catch (e) {}
      }
    }
    focusId = null;
  }

  app.addEventListener('click', function (e) {
    var t = e.target;
    var nav = t.closest('[data-nav]');
    if (nav) { TK.go(nav.getAttribute('data-nav')); return; }
    var unit = t.closest('.ubtn[data-unit]');
    if (unit) { TK.setUnit(unit.getAttribute('data-unit')); return; }
    var th = t.closest('[data-theme-set]');
    if (th) {
      if (S.theme !== th.getAttribute('data-theme-set')) TK.toggleTheme();
      return;
    }
    var shift = t.closest('[data-shift]');
    if (shift) { TK.shiftMonth(Number(shift.getAttribute('data-shift'))); TK.refresh(); return; }
    if (t.closest('[data-latest]')) { TK.resetToday(); TK.refresh(); return; }
    var day = t.closest('[data-day]');
    if (day) { TK.selectDay(day.getAttribute('data-day')); TK.refresh(); return; }
    var lg = t.closest('[data-legend]');
    if (lg) {
      var p = lg.getAttribute('data-legend');
      var i = S.offDirs.indexOf(p);
      if (i >= 0) S.offDirs.splice(i, 1); else S.offDirs.push(p);
      TK.refresh(); return;
    }
    var dir = t.closest('[data-dir]');
    if (dir) { TK.go('conv', { dir: dir.getAttribute('data-dir') }); return; }
    var model = t.closest('[data-model]');
    if (model) { TK.go('conv', { model: model.getAttribute('data-model') }); return; }
    var cell = t.closest('[data-cell-agent]');
    if (cell) {
      S.convFilter = { dir: null, agent: cell.getAttribute('data-cell-agent'), model: cell.getAttribute('data-cell-model') };
      S.convId = null;
      TK.go('conv');
      return;
    }
    var cv = t.closest('[data-cv]');
    if (cv) { S.convId = cv.getAttribute('data-cv'); TK.refresh(); return; }
    if (t.closest('[data-tocal]')) {
      var tid = t.closest('[data-tocal]').getAttribute('data-tocal');
      var cur = W.convs.filter(function (x) { return x.id === tid; })[0];
      if (cur) TK.go('home', { day: cur.date });
      return;
    }
    if (t.closest('[data-backdir]')) {
      var bid = t.closest('[data-backdir]').getAttribute('data-backdir');
      var cd = W.convs.filter(function (x) { return x.id === bid; })[0];
      if (cd) TK.go('conv', { dir: cd.dir });
      return;
    }
    if (t.closest('[data-clearf]')) {
      S.convFilter = { dir: null, agent: null, model: null };
      S.convQ = '';
      S.convId = null;
      TK.refresh(); return;
    }
    var level = t.closest('[data-level]');
    if (level) { TK.setLog({ lvl: level.getAttribute('data-level') }); return; }
    var src = t.closest('[data-src]');
    if (src) { TK.setLog({ src: src.getAttribute('data-src') }); return; }
    var batch = t.closest('[data-batch]');
    if (batch) {
      var id = Number(batch.getAttribute('data-batch'));
      TK.setLog({ batch: S.log.batch === id ? null : id });
      return;
    }
    if (t.closest('[data-logclear]')) {
      TK.setLog({ batch: null, lvl: 'all', src: 'all', q: '' });
      return;
    }
    var rs = t.closest('[data-rescan]');
    if (rs) {
      if (rs.disabled) return;
      var msg = document.getElementById('scanmsg');
      rs.disabled = true; rs.textContent = '扫描中';
      if (msg) msg.textContent = 'queued';
      setTimeout(function () {
        if (!document.body.contains(rs)) return;
        rs.disabled = false; rs.textContent = '重新扫描';
        if (msg) msg.textContent = 'done · 0 new';
      }, 1200);
    }
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fDir') { S.convFilter.dir = t.value || null; S.convId = null; TK.refresh(); }
    else if (t.id === 'fAgent') { S.convFilter.agent = t.value || null; S.convId = null; TK.refresh(); }
    else if (t.id === 'fModel') { S.convFilter.model = t.value || null; S.convId = null; TK.refresh(); }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'convq') { S.convQ = t.value; TK.refresh(); }
    else if (t.id === 'logq') { S.log.q = t.value; TK.refresh(); }
  });

  TK.mount(draw);
  draw();
  if (MQ.addEventListener) MQ.addEventListener('change', draw);
})();
</script>
</body>
</html>
