<!-- 应用图标：一张小票，三行内容。深色圆角底 + 米色小票（下缘撕纸锯齿），
     两行灰色的「文字」加一行加粗的红色「合计」。按 macOS 惯例内容缩到画布
     的 80%，四周留透明边距。源文件改完跑 `npm run icon` 重新生成 PNG。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(102.4 102.4) scale(0.8)">
    <rect width="1024" height="1024" rx="232" fill="#17181a"/>

    <!-- 小票：上方圆角，下方撕纸锯齿 -->
    <path fill="#f6f5f0" d="M 252 268 A 36 36 0 0 1 288 232 L 736 232 A 36 36 0 0 1 772 268
      L 772 700 L 728 748 L 684 700 L 640 748 L 596 700 L 552 748 L 508 700 L 464 748
      L 420 700 L 376 748 L 332 700 L 288 748 L 252 700 Z"/>

    <!-- 两行文字 + 一行合计 -->
    <rect x="332" y="360" width="360" height="44" rx="22" fill="#17181a"/>
    <rect x="332" y="452" width="240" height="44" rx="22" fill="#a9aba5"/>
    <rect x="332" y="544" width="360" height="76" rx="38" fill="#bf3b22"/>
  </g>
</svg>
